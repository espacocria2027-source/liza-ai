<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>L.I.Z.A.</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>L.I.Z.A.</h1>

    </header>

    <main id="chat" class="chat">

        <div class="welcome">

            <h2>Olá!</h2>

            <p>Como posso ajudar você hoje?</p>

        </div>

    </main>

    <!-- TEMPLATE IA -->

    <template id="assistantTemplate">

        <div class="message assistant">

            <div class="message-body">

                <div class="message-content"></div>

                <div class="message-actions">

                    <button class="copy">

                        📋 Copiar

                    </button>

                </div>

            </div>

        </div>

    </template>

    <!-- TEMPLATE USUÁRIO -->

    <template id="userTemplate">

        <div class="message user">

            <div class="message-body">

                <div class="message-content"></div>

            </div>

        </div>

    </template>

    <div
        id="typing"
        class="typing"
        style="display:none;">

        L.I.Z.A. está digitando...

    </div>

    <footer>

        <textarea

            id="message"

            rows="2"

            placeholder="Digite sua mensagem..."

        ></textarea>

        <button id="send">

            Enviar

        </button>

    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
